[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ccgen"
version = "1.0.0"
description = "Offline subtitle generation, translation, transliteration, and dubbing"
authors = [{ name = "Shah Faisal", email = "shahfaisalgfg@gmail.com" }]
readme = "readme.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "faster-whisper>=1.0.3",
    "av>=11",
    "argostranslate>=1.9.6",
    "PySide6>=6.7.0",
    "indic-transliteration>=2.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "transformers>=4.51,<5",
    "torch>=2.2,<2.9",
    "torchaudio>=2.2,<2.9",
    "sentencepiece>=0.2.0",
    "huggingface_hub>=0.24",
    "psutil>=5.9",
    "llama-cpp-python>=0.3.19",
    "coqui-tts[ja,zh,ko]>=0.27.5,<0.28",
    "kokoro-onnx>=0.4.9",
    "piper-tts>=1.3",
]

[project.scripts]
ccgen = "main:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyright>=1.1", "pyinstaller>=6.17"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
include = ["ccgen", "main.py", "app.py", "server.py", "tests"]
exclude = ["ccgen/engines/speech/omnivoice"]
reportPrivateImportUsage = "none"

[tool.setuptools.packages.find]
where = ["."]
include = ["ccgen*"]

[tool.ccgen]
display_name = "CC-Gen-Ultimate"
publisher    = "gfgRoyal"
url          = "https://shahfaisalgfg.github.io/shahfaisal/"
exe_name     = "CC-Gen-Ultimate.exe"
winget_id    = "gfgRoyal.CCGenUltimate"
