name: Publish to WinGet

# DEV-BUILD STATUS: manual-dispatch only for now (see build-release.yml and
# .github/workflows/README.md). Once the app is ready for its first stable
# release, uncomment the `release: types: [published]` trigger below so this
# fires automatically whenever build-release.yml publishes a GitHub Release.
#
# on:
#   release:
#     types: [published]
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to submit (e.g. v1.0.0)'
        required: true

jobs:
  publish:
    runs-on: windows-latest
    steps:
      # winget installs one installer file. An installer over GitHub's 2 GiB file limit is
      # published as an exe with -N.bin parts (scripts/bundle.ps1), which winget can't use, so
      # the submission is skipped with a warning.
      - name: Check the installers are single files
        id: single
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag   = "${{ github.event.inputs.tag }}"
          $names = gh release view $tag --repo "${{ github.repository }}" --json assets --jq '.assets[].name'
          if ($LASTEXITCODE -ne 0) { throw "gh release view failed (exit $LASTEXITCODE)" }
          $parts = $names | Where-Object { $_ -match '^CC-Gen-Ultimate_[0-9.]+_(user|system)_installer-\d+\.bin$' }
          if ($parts) {
            Write-Output "::warning::The installers of $tag are split into parts ($($parts -join ', ')); winget can't install them, so nothing was submitted."
            "split=true" | Out-File $env:GITHUB_OUTPUT -Append
          } else {
            "split=false" | Out-File $env:GITHUB_OUTPUT -Append
          }

      - name: Download wingetcreate
        if: steps.single.outputs.split == 'false'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe

      - name: Submit update to winget-pkgs
        if: steps.single.outputs.split == 'false'
        shell: pwsh
        env:
          WINGET_PAT: ${{ secrets.WINGET_PAT }}
        run: |
          $tag     = "${{ github.event.inputs.tag }}"
          $version = $tag -replace '^v', ''
          $base    = "https://github.com/${{ github.repository }}/releases/download/$tag"

          $userUrl = "$base/CC-Gen-Ultimate_${version}_user_installer.exe"
          $sysUrl  = "$base/CC-Gen-Ultimate_${version}_system_installer.exe"

          .\wingetcreate.exe update gfgRoyal.CCGenUltimate `
            --version $version `
            --urls    "${userUrl}|x64|inno|user" "${sysUrl}|x64|inno|machine" `
            --token   $env:WINGET_PAT `
            --submit
