name: Build and Release

# DEV-BUILD STATUS: the app isn't stable/usable yet, so this workflow is
# manual-trigger only for now. It will NOT fire on tag pushes. Once the app is
# ready for its first stable release, uncomment the `push: tags:` trigger below
# (and remove this comment block) to make releases automatic again.
#
# on:
#   push:
#     tags:
#       - 'v[0-9]*'
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build/release (e.g. v1.0.0) - must already exist'
        required: true

# Needed so gh release create can upload assets
permissions:
  contents: write

jobs:
  # One build per GPU family: an installer can carry only one PyTorch build (see scripts/bundle.ps1).
  # "cuda" is the main release (NVIDIA); "legacy" is the edition for older NVIDIA GPUs, named with
  # "_nvidia_legacy"; "xpu" is the Intel GPU edition, named with "_intel_gpu".
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: true
      matrix:
        gpu: [cuda, legacy, xpu]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # Single source of truth: all metadata comes from pyproject.toml
      - name: Read app metadata
        id: meta
        shell: pwsh
        run: |
          $json = python scripts/read_meta.py
          $m    = $json | ConvertFrom-Json
          . .\scripts\bundle.ps1
          "VER=$($m.Version)"                   | Out-File $env:GITHUB_OUTPUT -Append
          "APP_NAME=$($m.AppName)"              | Out-File $env:GITHUB_OUTPUT -Append
          "PUBLISHER=$($m.Publisher)"           | Out-File $env:GITHUB_OUTPUT -Append
          "URL=$($m.Url)"                       | Out-File $env:GITHUB_OUTPUT -Append
          "EXE_NAME=$($m.ExeName)"              | Out-File $env:GITHUB_OUTPUT -Append
          "SUFFIX=$($GpuSuffix['${{ matrix.gpu }}'])" | Out-File $env:GITHUB_OUTPUT -Append

      # A local staging build points the updater at a test server and a test key
      # (ccgen/config/update_staging.py); that file must never reach a release.
      - name: Check no staging update feed is present
        shell: pwsh
        run: |
          if (Test-Path ccgen\config\update_staging.py) {
            Write-Error "ccgen\config\update_staging.py is a local test file; delete it before releasing."
            exit 1
          }

      # PyInstaller is a dev-only dependency (pyproject's [dev] extra), so it is installed here.
      # Install-GpuRuntime then swaps in this build's PyTorch and the DirectML ONNX Runtime.
      - name: Install Python dependencies
        shell: pwsh
        run: |
          pip install -r requirements.txt "pyinstaller>=6.17"
          if ($LASTEXITCODE -ne 0) { throw "pip install failed (exit $LASTEXITCODE)" }
          . .\scripts\bundle.ps1
          Install-GpuRuntime -Gpu ${{ matrix.gpu }}

      # Tests mock every model download, so they run offline. Both builds share the same code,
      # so the checks run once.
      - name: Run tests
        if: matrix.gpu == 'cuda'
        shell: pwsh
        run: python -m pytest tests -q

      - name: Type-check
        if: matrix.gpu == 'cuda'
        shell: pwsh
        run: pyright ccgen/ app.py main.py server.py
      # Compiles ccgen_shell.dll using MSVC + CMake. No vcpkg/third-party
      # dependencies - it's pure Win32/COM, so no dependency cache is needed.
      - name: Build native shell extension
        shell: pwsh
        run: .\scripts\build_native.ps1

      - name: Create build output directory
        shell: pwsh
        run: New-Item -ItemType Directory -Path build\installer -Force | Out-Null

      # Bundles the Python app into dist\CC-Gen-Ultimate\ (onedir - used by both installers), with
      # the ccgen command line as a second exe sharing _internal. scripts/bundle.ps1 holds the
      # PyInstaller arguments shared with the local build scripts.
      - name: Build PyInstaller bundle
        shell: pwsh
        run: |
          . .\scripts\bundle.ps1
          Invoke-OnedirBuild -Name "${{ steps.meta.outputs.APP_NAME }}" -DistPath "dist"

      # Runs the frozen exe with --self-test: imports every engine and lazily loaded module, loads
      # the native libraries, decodes audio, loads the speech engines' eSpeak and dictionary data,
      # starts the API server, and compiles all QML. A module, DLL, or data file missing from the
      # bundle fails the release here instead of on a user's PC.
      - name: Verify PyInstaller bundle
        shell: pwsh
        run: |
          . .\scripts\bundle.ps1
          $appName = "${{ steps.meta.outputs.APP_NAME }}"
          if (-not (Test-Bundle "dist\$appName\$appName.exe")) { throw "Bundle self-test failed" }
          if (-not (Test-CliBundle "dist\$appName\ccgen.exe")) { throw "The ccgen command line doesn't run" }
      - name: Copy shell DLL into bundle
        shell: pwsh
        run: Copy-Item build\shell\ccgen_shell.dll dist\${{ steps.meta.outputs.APP_NAME }}\ -Force

      # build.ini next to the exe names this GPU edition and fingerprints the bundled runtime
      # (scripts/runtime_id.py, after the shell DLL joins it), so the in-app updater picks this
      # edition's files and, when only the app changed, the small patch installer.
      - name: Record the edition and runtime
        shell: pwsh
        run: |
          . .\scripts\bundle.ps1
          Write-BuildInfo -BundleDir "dist\${{ steps.meta.outputs.APP_NAME }}" -Gpu ${{ matrix.gpu }} -ExeName "${{ steps.meta.outputs.EXE_NAME }}"

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      # The full installers (split into an exe and -N.bin parts when one would reach GitHub's
      # 2 GiB file limit) and the patch installer, which replaces only the app layer of a copy
      # with the same runtime. The app metadata comes from pyproject.toml.
      - name: Build installers
        shell: pwsh
        run: |
          . .\scripts\bundle.ps1
          . .\scripts\app_meta.ps1
          $meta = Get-AppMeta
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          New-Item -ItemType Directory -Path release -Force | Out-Null
          foreach ($kind in "system", "user", "patch") {
            $files = Invoke-InstallerBuild -Iscc $iscc -IssFile "installer\ccgenultimate_${kind}_installer.iss" `
              -Meta $meta -Suffix "${{ steps.meta.outputs.SUFFIX }}"
            Copy-Item $files release\
          }

      # The portable folder is the onedir bundle as a .7z, cut into volumes (<name>.7z.001, ...)
      # when it reaches the 2 GiB limit; 7-Zip opens the .001 with the rest beside it. It can't
      # replace itself, so the app links to new releases instead. No one-file exe is published:
      # it would be over the limit and unpack gigabytes to %TEMP% at every start.
      # The bundle's folder is given to 7-Zip as a full path: 7-Zip keeps a relative path's folders
      # in the archive, which would put the app under dist\<App>\ instead of at its top.
      - name: Pack the portable folder
        shell: pwsh
        run: |
          . .\scripts\bundle.ps1
          $archive = "release\${{ steps.meta.outputs.APP_NAME }}_${{ steps.meta.outputs.VER }}${{ steps.meta.outputs.SUFFIX }}_portable.7z"
          $bundle = (Resolve-Path "dist\${{ steps.meta.outputs.APP_NAME }}").Path
          & "C:\Program Files\7-Zip\7z.exe" a -t7z -mx=9 $archive "$bundle\*"
          if ($LASTEXITCODE -ne 0) { throw "7z: portable archive failed (exit $LASTEXITCODE)" }
          $null = Split-ReleaseFile $archive

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.gpu }}
          path: release\*
          if-no-files-found: error

      # The release job lists each edition's runtime fingerprint in the update manifest.
      - name: Upload build info
        uses: actions/upload-artifact@v4
        with:
          name: buildinfo-${{ matrix.gpu }}
          path: dist\${{ steps.meta.outputs.APP_NAME }}\build.ini
          if-no-files-found: error

  # Publishes one GitHub Release with every edition's files once every build has passed.
  release:
    needs: build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Download build info
        uses: actions/download-artifact@v4
        with:
          pattern: buildinfo-*
          path: buildinfo

      # GitHub refuses a release file of 2 GiB or more; stop before a release is half uploaded.
      - name: Check every release file is under 2 GiB
        shell: pwsh
        run: |
          $big = Get-ChildItem release -File | Where-Object Length -ge 2000000000
          foreach ($file in $big) { Write-Error "$($file.Name) is $($file.Length) bytes, over GitHub's 2 GiB limit" }
          if ($big) { exit 1 }

      # update.json lists what the in-app updater installs for each edition: the system and user
      # installers (with their parts) and the patch installer for that edition's runtime, with
      # sizes and SHA-256 hashes. It is signed with UPDATE_SIGNING_KEY; --expect stops a release
      # signed with a key CC-Gen-Ultimate doesn't carry, which no installed copy could verify.
      - name: Write and sign the update manifest
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          python -m pip install "cryptography>=46"
          if ($LASTEXITCODE -ne 0) { throw "pip install failed (exit $LASTEXITCODE)" }
          . .\scripts\bundle.ps1
          $m = python scripts/read_meta.py | ConvertFrom-Json
          $specs = @()
          foreach ($gpu in "cuda", "legacy", "xpu") {
            $runtime = (Select-String -Path "buildinfo\buildinfo-$gpu\build.ini" -Pattern '^runtime_id\s*=\s*([0-9a-f]{64})').Matches[0].Groups[1].Value
            $base = "release\$($m.AppName)_$($m.Version)$($GpuSuffix[$gpu])"
            foreach ($kind in "system", "user") {
              $parts = Get-ChildItem "${base}_${kind}_installer-*.bin" -ErrorAction SilentlyContinue |
                Sort-Object { [int]($_.BaseName -replace '^.*-(\d+)$', '$1') } | ForEach-Object { $_.FullName }
              $files = @("${base}_${kind}_installer.exe") + @($parts)
              $specs += "--package", "kind=$kind;edition=$gpu;files=$($files -join ',')"
            }
            $specs += "--package", "kind=patch;edition=$gpu;runtime_id=$runtime;files=${base}_patch_installer.exe"
          }
          python scripts/make_update_manifest.py --app $m.AppName --version $m.Version `
            --repo $env:GITHUB_REPOSITORY --out release\update.json @specs
          if ($LASTEXITCODE -ne 0) { throw "make_update_manifest.py failed (exit $LASTEXITCODE)" }
          python scripts/sign_update.py release\update.json --expect ccgen\config\defaults.py
          if ($LASTEXITCODE -ne 0) { throw "sign_update.py failed (exit $LASTEXITCODE)" }

      # Must use RELEASE_PAT (not GITHUB_TOKEN) - events fired by GITHUB_TOKEN
      # do not cascade into other workflows, so winget-release.yml would never trigger.
      - name: Create GitHub Release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          $json    = python scripts/read_meta.py
          $m       = $json | ConvertFrom-Json
          $tag     = "${{ github.event.inputs.tag }}"
          $files   = Get-ChildItem release -File | ForEach-Object { $_.FullName }
          gh release create $tag `
            --title "$($m.AppName) v$($m.Version)" `
            --notes-file "release_notes/release_notes_v$($m.Version).md" `
            @files
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed (exit $LASTEXITCODE)" }
